services:
  postgres:
    image: postgres:16-alpine
    container_name: pgcb_postgres
    environment:
      POSTGRES_DB: pgcb
      POSTGRES_USER: pgcb
      POSTGRES_PASSWORD: pgcb
    ports:
      - "5432:5432"
    volumes:
      - pgcb_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgcb -d pgcb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgcb_data:
